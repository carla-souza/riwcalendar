<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RIW 2026 Calendar</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <header class="cabecalho">
    <h1 class="cabecalho__titulo">RIW 2026 Calendar</h1>
    <p class="cabecalho__subtitulo">Vibecoded por <a href="https://www.instagram.com/artboard.overflow/"
      target="_blank" rel="noopener noreferrer">@artboard.overflow</a></p>
  </header>

  <nav class="abas" aria-label="Navegação principal">
    <button class="abas__botao" data-aba="programacao" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span>Programação</span>
    </button>
    <button class="abas__botao" data-aba="agenda" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Minha agenda</span>
    </button>
    <button class="abas__botao" data-aba="mapa" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/>
        <line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
      <span>Mapa</span>
    </button>
  </nav>

  <main class="conteudo">
    <section id="programacao" class="secao">
      <h2 class="secao__titulo">Programação</h2>
      <div id="programacao-dias" class="filtros__dias" role="group" aria-label="Filtrar por dia"></div>
      <div id="programacao-filtros" class="filtros"></div>
      <div id="programacao-conteudo" class="secao__corpo">
        <p class="carregando">Carregando palestras…</p>
      </div>
    </section>

    <section id="agenda" class="secao" hidden>
      <h2 class="secao__titulo">Minha agenda</h2>
      <div id="agenda-dias" class="filtros__dias" role="group" aria-label="Selecionar dia da agenda"></div>
      <div id="agenda-conteudo" class="secao__corpo">
        <p class="placeholder">Em construção — chega numa próxima seção do plano.</p>
      </div>
    </section>

    <section id="mapa" class="secao" hidden>
      <h2 class="secao__titulo">Mapa</h2>
      <div id="mapa-conteudo" class="secao__corpo">
        <p class="placeholder">Em construção — chega numa próxima seção do plano.</p>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
